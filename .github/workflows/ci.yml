name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint and test
    runs-on: ubuntu-latest

    # A real Postgres, on purpose. packages/ingest/test/reconcile.test.ts uses
    # `describe.skip` when no database is reachable, so without this the whole
    # DB-backed suite reports green while running nothing — the one failure mode
    # this project keeps rediscovering. CI is the place that must never skip it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aio
          POSTGRES_PASSWORD: aio
          POSTGRES_DB: aio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aio -d aio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://aio:aio@localhost:5432/aio
      DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the Dockerfile runs, so CI and the image
          # cannot disagree about the runtime.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # This runs FIRST, before Typecheck, and the order is load-bearing.
      # `apps/web/src/routeTree.gen.ts` is gitignored and written by the
      # TanStack Start Vite plugin, so in a fresh checkout it does not exist
      # until something runs the build. `apps/web/src/router.tsx` imports it,
      # and typechecking without it produced one TS2307 plus ~60 downstream
      # errors across `apps/web/src/routes/*` — invisible to anyone who had
      # already built locally and had the file sitting untracked. See #12.
      #
      # This is the same command the Dockerfile runs to build the image, so
      # there is one generation incantation in the repo rather than a CI-only
      # copy that can drift from it.
      #
      # It also earns its own keep: neither `bun test` nor `tsc` exercises the
      # SSR build, and the build is where most of this app's failures surface.
      - name: Build web (also generates routeTree.gen.ts for Typecheck)
        run: bun run --filter @aio/web build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Migrate
        run: bun run --filter @aio/db db:migrate

      - name: Test
        run: bun test

  stack:
    name: compose stack serves the dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker compose up` is the entire promise this repo makes to someone who
      # clones it, so it is tested rather than described. A Dockerfile that
      # builds is not a stack that serves: a COPY narrowed to the wrong files, a
      # missed workspace manifest, or a migration that races first-boot initdb
      # all build green and only fail when something tries to use them.
      - name: Start the stack
        run: docker compose up -d --build

      # `-L` is load-bearing. `/` answers 307 to `/?segment=global&...` before
      # anything renders, and `curl -f` does NOT fail on a 3xx — so without it
      # this step saved the redirect stub, declared the dashboard up, and left
      # both content greps below to miss for a reason that had nothing to do
      # with the content. That is how #20 spent the life of the repo disguised
      # as an empty-state copy problem. Follow the redirect and /tmp/page.html
      # is the page a browser would actually show.
      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -L --max-redirs 5 -o /tmp/page.html http://localhost:3000/; then
              echo "final URL: $(curl -fsS -L --max-redirs 5 -o /dev/null -w '%{url_effective} (%{http_code})' http://localhost:3000/)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::dashboard did not answer on :3000"
          docker compose ps
          docker compose logs
          exit 1

      # A 200 is not a working page. TanStack renders its error boundary with a
      # 200 on some failures, and an empty database is exactly the state a fresh
      # clone is in — so assert the empty state renders, not merely that
      # something came back.
      #
      # `-a` because the SSR stream embeds NUL bytes, so grep classifies the
      # saved page as binary. GNU grep still matches through it, but BSD grep
      # (anyone reproducing this on macOS) reports no match — and a content
      # assertion that answers differently depending on whose laptop runs it is
      # exactly the kind of check this repo keeps getting burned by.
      - name: Dashboard renders the empty state, not an error
        run: |
          if grep -aq "Something went wrong" /tmp/page.html; then
            echo "::error::dashboard rendered its error boundary"
            docker compose logs web
            exit 1
          fi
          grep -aq "No runs ingested yet" /tmp/page.html || {
            echo "::error::expected the empty-state message on a fresh database"
            head -c 2000 /tmp/page.html
            exit 1
          }

      # A page that renders once is not a stack that works. #20 died on first
      # render, restarted, and served exactly one redirect per life — so the
      # container looked healthy to anything that asked it a single question.
      # Ask all five pages, then check the process never went down answering
      # them. A crash-restart loop cannot survive both assertions.
      - name: Every page renders, and the web process never restarts
        run: |
          before="$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q web)")"
          failed=0
          for route in / /runs /prompts /competitive /cited; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 30 "http://localhost:3000$route")"
            echo "$route -> $code"
            [ "$code" = "200" ] || failed=1
          done
          after="$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q web)")"
          echo "RestartCount: $before -> $after"
          [ "$before" = "$after" ] || {
            echo "::error::web restarted while serving pages ($before -> $after)"
            failed=1
          }
          if [ "$failed" = "1" ]; then
            docker compose ps
            docker compose logs web
            exit 1
          fi

      # With ALLOWED_EMAIL_DOMAINS unset there is no sign-in flow, so /login must
      # redirect out rather than offer a button that cannot work. Getting this
      # wrong produces an infinite redirect between / and /login, which a status
      # check alone would not catch.
      - name: Login redirects away when access is unrestricted
        run: |
          final="$(curl -fsS -o /dev/null -w '%{url_effective}' -L --max-redirs 5 http://localhost:3000/login)"
          case "$final" in
            *"/login"*) echo "::error::/login did not redirect away (landed on $final)"; exit 1 ;;
            *) echo "ok: /login -> $final" ;;
          esac

      # ── Populated ───────────────────────────────────────────────────────────
      #
      # Everything above this line asserts the EMPTY state, and has to stay above
      # it: seeding first would make those greps fail for a reason that has
      # nothing to do with what they check.
      #
      # But the empty state is not the state anyone uses. Every interesting
      # failure in this project happens once there are rows in it — a cohort
      # computed over the wrong denominator, a rate that reads 0% where it means
      # "no data", a series that silently ended. A dashboard that rendered
      # correctly empty and wrongly populated used to pass this job. See #8.
      #
      # NOTHING BELOW ASSERTS A GENERATED METRIC VALUE. The corpus is
      # deterministic, so `grep "37.5%"` would pass today and would then fail on
      # every tuning change in the seeder while proving nothing about
      # correctness. Every assertion below is over structure (is this rendered at
      # all?) or over a relationship between two numbers on the page.
      - name: Seed a deterministic corpus and ingest it
        run: |
          set -euo pipefail
          # Generated *inside the already-built image*, not on the runner: the
          # image carries the whole workspace with its dependencies installed, so
          # this costs no second `bun install`, and the corpus is produced by
          # exactly the code the stack is serving. `seed` and `ingest` share one
          # container because `results/` is not a volume — the JSONL that seed
          # writes has to still be on disk when ingest reads it.
          #
          # `set -e` inside, and no `|| true` outside: a failed seed or a failed
          # ingest fails HERE, rather than leaving the assertions below to report
          # "the dashboard is empty" for a reason that is not about the dashboard.
          docker compose run --rm -T migrate sh -c '
            set -e
            cp analytics.config.example.json analytics.config.json
            bun run seed
            bun run ingest
          ' 2>&1 | tee /tmp/ingest.log

          # How many runs the corpus actually contains, read back from the
          # reconciler rather than hard-coded, so the run-count assertion below
          # compares the page against the seeder instead of against a literal
          # that someone has to remember to update.
          runs="$(grep -cE '^(✓|·) [0-9]{4}-[0-9]{2}-[0-9]{2}' /tmp/ingest.log || true)"
          [ "$runs" -gt 0 ] || { echo "::error::ingest reported no runs"; exit 1; }
          echo "seeded runs: $runs"
          echo "SEEDED_RUNS=$runs" >> "$GITHUB_ENV"

      # The same five routes the empty-state step walks, asked the same way (`-L`
      # for the 307 off `/`, `-a` because the SSR stream embeds NUL bytes) — but
      # now every one of them must render CONTENT.
      #
      # `shell__placeholder` is the single class every page uses for "there is
      # nothing here": "No runs ingested yet", "No prompts in this segment", "No
      # competitive results in this scope". Asserting the class is absent catches
      # all of them at once, including a view that quietly falls back to an empty
      # scope — which a grep for one message would miss. Each route then has to
      # show a positive marker that only its populated branch emits.
      - name: Every page renders populated, not empty and not an error
        run: |
          set -euo pipefail
          fail=0
          check() {   # route  marker-class  human name
            local route="$1" marker="$2" name="$3" file
            file="/tmp/pop$(echo "$route" | tr '/' '_').html"
            curl -fsS -L --max-redirs 5 --max-time 30 -o "$file" "http://localhost:3000$route"
            if grep -aq "Something went wrong" "$file"; then
              echo "::error::$route rendered the error boundary"; fail=1; return
            fi
            if grep -aq 'class="shell__placeholder"' "$file"; then
              echo "::error::$route still renders an empty state after ingest"
              grep -ao 'class="shell__placeholder">[^<]*' "$file" | head -3
              fail=1; return
            fi
            local n
            n="$(grep -ao "class=\"$marker\"" "$file" | wc -l | tr -d ' ')"
            [ "$n" -gt 0 ] || { echo "::error::$route: no $name rendered"; fail=1; return; }
            echo "ok: $route -> $n $name"
          }
          check /            funnel__count  "cohort funnel counts"
          check /runs        runs__date     "run rows"
          check /prompts     prompts__link  "prompt rows"
          check /competitive comp__hbarname "competitor leaderboard rows"
          check /cited       comp__block    "cited-view blocks"
          if [ "$fail" = "1" ]; then docker compose logs web; exit 1; fi

      # The run list must have exactly one row per ingested run. Off-by-one here
      # is how a series silently ends: the dashboard keeps rendering, just with a
      # run missing from the end of it.
      - name: The run list has one row per ingested run
        run: |
          set -euo pipefail
          rows="$(grep -ao 'class="runs__date"' /tmp/pop_runs.html | wc -l | tr -d ' ')"
          header="$(grep -ao 'class="runs__count">[0-9,]*' /tmp/pop_runs.html | sed 's/.*>//; s/,//g')"
          echo "ingested=$SEEDED_RUNS  table rows=$rows  header count=$header"
          [ "$rows" = "$SEEDED_RUNS" ] || {
            echo "::error::/runs shows $rows rows for $SEEDED_RUNS ingested runs"; exit 1; }
          [ "$header" = "$SEEDED_RUNS" ] || {
            echo "::error::/runs header says $header for $SEEDED_RUNS ingested runs"; exit 1; }

      # Cohort counts, not cohort rates: every sub-cohort is drawn from the
      # error-free All population, so none of them can exceed it. A count that
      # escapes its own denominator is a rate above 100% waiting to render.
      #
      # Only the containments that actually hold are asserted. Competitive
      # (others_present) is NOT a subset of Mentioned, whatever the funnel's
      # indentation suggests — that is #24, and asserting the relationship the
      # indentation implies would encode the bug as the contract.
      - name: Cohort counts stay inside the All denominator
        run: |
          set -euo pipefail
          read -r all mentioned competitive cited <<<"$(
            grep -ao 'class="funnel__count">[0-9,]*' /tmp/pop_.html \
              | sed 's/.*>//; s/,//g' | tr '\n' ' '
          )"
          echo "All=$all Mentioned=$mentioned Competitive=$competitive Cited=$cited"
          [ "$all" -gt 0 ] || { echo "::error::All cohort is empty after ingest"; exit 1; }
          for pair in "Mentioned:$mentioned" "Competitive:$competitive" "Cited:$cited"; do
            name="${pair%%:*}"; n="${pair#*:}"
            [ "$n" -le "$all" ] || {
              echo "::error::$name ($n) exceeds All ($all)"; exit 1; }
          done

      # ── The assertion this whole job exists for ──────────────────────────────
      #
      # The seeded corpus fails one provider for exactly one week (README, "The
      # world it renders is deliberate"). Those results carry an error, and the
      # rule this project is organised around is that an errored result is
      # EXCLUDED from every cohort and every denominator — it is never counted as
      # a zero. A zero and a gap look identical on a dashboard and mean opposite
      # things, so this is the one case worth asserting in CI over any aggregate.
      #
      # Three facts, none of them a metric value:
      #   1. the outaged provider's rate cells render an em dash, not "0.0%"
      #   2. its All count is 0 while its coverage row shows attempted == errored
      #   3. the run's All denominator is exactly the prior run's, minus the
      #      results that errored — i.e. they were dropped, not zeroed
      #
      # The run date and provider are corpus structure, not tuning: if the seeder
      # ever stops producing an outage, this step failing is the correct outcome,
      # because CI would otherwise be silently unable to test the rule again.
      - name: The outage week renders a gap, not a zero
        env:
          OUTAGE_RUN: "2026-08-03"
          OUTAGE_PROVIDER: "exa"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          BASE = "http://localhost:3000"
          RUN = os.environ["OUTAGE_RUN"]
          PROVIDER = os.environ["OUTAGE_PROVIDER"]
          EMDASH = "\u2014"
          failures = []

          def fetch(path):
              # curl, not urllib, and `-L` for the same reason the steps above use
              # it: `/` answers 307 before it renders anything (#20).
              out = subprocess.run(
                  ["curl", "-fsS", "-L", "--max-redirs", "5", "--max-time", "30", BASE + path],
                  capture_output=True, check=True,
              ).stdout
              return out.decode("utf-8", "replace")

          def table(html, cls):
              m = re.search(r'<table class="%s">.*?</table>' % cls, html, re.S)
              if not m:
                  sys.exit("::error::no <table class=\"%s\"> on the outage run page" % cls)
              return m.group(0)

          def row(table_html, provider):
              for tr in re.findall(r"<tr>.*?</tr>", table_html, re.S):
                  if re.search(r">%s(<|\s)" % re.escape(provider), tr):
                      return tr
              sys.exit('::error::provider "%s" has no row — the corpus no longer '
                       "contains the outage this step exists to check" % provider)

          def vals(tr):
              """The value spans of a row, in column order (deltas excluded)."""
              return re.findall(r'<span class="themes__val">([^<]*)</span>', tr)

          page = fetch("/?run=%s&segment=global&byProvider=true" % RUN)
          if "Something went wrong" in page:
              sys.exit("::error::the outage run page rendered its error boundary")

          # The page normalises an unknown `?run=` to the latest run, so confirm we
          # are looking at the run we asked for before believing anything on it.
          shown = re.search(r'class="score__rundate">([^<]*)</span>', page)
          if not shown or shown.group(1) != RUN:
              sys.exit("::error::asked for run %s, page shows %s"
                       % (RUN, shown.group(1) if shown else "nothing"))

          # 1 + 2 — the provider breakdown row.
          prov_tr = row(table(page, "themes__table"), PROVIDER)
          prov_vals = vals(prov_tr)          # All, mention, accuracy, owned-cite, 1st
          all_count = int(prov_vals[0].replace(",", ""))
          rates = prov_vals[1:]
          if all_count != 0:
              failures.append("%s kept %d error-free results in the outage run; "
                              "this step assumes the whole week errored"
                              % (PROVIDER, all_count))
          bad = [r for r in rates if r != EMDASH]
          if bad:
              failures.append("%s rate cells rendered %s instead of an em dash — "
                              "an errored week is being counted as a zero"
                              % (PROVIDER, bad))
          else:
              print("ok: %s renders %s for all %d rate cells, not 0.0%%"
                    % (PROVIDER, EMDASH, len(rates)))

          # The coverage table is where the failure is supposed to be visible.
          cov_vals = vals(row(table(page, "coverage__table"), PROVIDER))
          attempted, errored = (int(v.replace(",", "")) for v in cov_vals[:2])
          if not (errored == attempted > 0):
              failures.append("coverage for %s reads attempted=%d errored=%d; "
                              "expected a fully errored provider"
                              % (PROVIDER, attempted, errored))
          else:
              print("ok: coverage shows %s attempted=%d errored=%d"
                    % (PROVIDER, attempted, errored))

          def funnel_all(html):
              counts = re.findall(r'class="funnel__count">([0-9,]*)<', html)
              return int(counts[0].replace(",", ""))

          # 3 — the denominator moved by exactly the errored results. Read the
          # prior run's date off the page rather than hard-coding a second date.
          prior = re.search(r'WoW vs <span class="score__rundate">([^<]*)</span>', page)
          if not prior:
              failures.append("the outage run has no prior run to compare against")
          else:
              prior_all = funnel_all(fetch("/?run=%s&segment=global" % prior.group(1)))
              outage_all = funnel_all(page)
              print("All: %s=%d  %s=%d  %s errored=%d"
                    % (prior.group(1), prior_all, RUN, outage_all, PROVIDER, errored))
              if outage_all != prior_all - errored:
                  failures.append(
                      "All went %d -> %d across the outage; errored results were "
                      "%d, so the denominator did not drop by exactly the results "
                      "that failed" % (prior_all, outage_all, errored))
              else:
                  print("ok: denominator dropped by exactly the %d errored results"
                        % errored)

          for f in failures:
              print("::error::" + f)
          sys.exit(1 if failures else 0)
          PY

      - name: Stop
        if: always()
        run: docker compose down -v
